<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Student Academic Portfolio</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header>
        <div class="container nav-container">
            <h1 class="logo">Widaad<span>.dev</span></h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Me</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="planner.html">Academic Planner</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container page-content">
        <h2 class="section-title">Get In Touch</h2>
        <p class="section-subtitle">Have a question about my projects or want to collaborate? Send a message below.</p>

        <div class="contact-wrapper card">
            <form id="contactForm" novalidate>
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
                    <small class="error-msg" id="nameError"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" placeholder="example@domain.com">
                    <small class="error-msg" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone" placeholder="08012345678">
                    <small class="error-msg" id="phoneError"></small>
                </div>

                <div class="form-group">
                    <label for="message">Message *</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write your message here..."></textarea>
                    <small class="error-msg" id="messageError"></small>
                </div>

                <button type="submit" class="btn btn-primary">Send Message</button>
                <p id="formSuccess" class="success-msg"></p>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Kabiawu Widaad | MIVA Open University COS 106 Project. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
